name: Build Mehani Android APK & Play Store AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g. 1.1.0)'
        required: false
        default: '1.1.0'
      version_code:
        description: 'Optional integer versionCode override (defaults to 100 + github.run_number)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK & Signed Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web assets & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ] && [ -e "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0" || true
          fi

      - name: Resolve Android versionCode & versionName
        run: |
          INPUT_CODE="${{ github.event.inputs.version_code }}"
          INPUT_NAME="${{ github.event.inputs.version_name }}"
          if [ -n "$INPUT_CODE" ]; then
            VER_CODE="$INPUT_CODE"
          else
            VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          fi
          if [ -n "$INPUT_NAME" ]; then
            VER_NAME="$INPUT_NAME"
          else
            VER_NAME="1.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "ANDROID_VERSION_CODE=$VER_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VER_NAME" >> "$GITHUB_ENV"
          echo "Using versionCode=$VER_CODE, versionName=$VER_NAME"

      - name: Grant execute permission for Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK (for direct device testing)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Debug APK artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/mehani-sudan.apk

      - name: Upload mehani-sudan.apk
        uses: actions/upload-artifact@v4
        with:
          name: mehani-sudan-apk
          path: apk-output/mehani-sudan.apk
          retention-days: 30

      - name: Decode Upload Keystore (when Release Signing secrets are configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/mehani-upload.jks
            echo "MEHANI_UPLOAD_STORE_FILE=/tmp/mehani-upload.jks" >> "$GITHUB_ENV"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not yet configured; skipping signed Uptodown APK & Play Store AAB builds."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Uptodown Release APK & Play Store Release AAB
        if: steps.keystore.outputs.has_signing == 'true'
        working-directory: android
        env:
          MEHANI_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEHANI_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEHANI_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare Signed Release Artifacts (Uptodown APK + Play AAB)
        if: steps.keystore.outputs.has_signing == 'true'
        run: |
          mkdir -p apk-release-output aab-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-release-output/mehani-sudan-uptodown-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab aab-output/mehani-sudan-play-release.aab

      - name: Upload Signed Uptodown Release APK
        if: steps.keystore.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mehani-sudan-uptodown-release-apk
          path: apk-release-output/mehani-sudan-uptodown-release.apk
          retention-days: 30

      - name: Upload Signed Play Store AAB
        if: steps.keystore.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mehani-sudan-play-release-aab
          path: aab-output/mehani-sudan-play-release.aab
          retention-days: 30

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/mehani-upload.jks
