<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mehani | مهني - لا يوجد اتصال بالإنترنت</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 24px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        margin: 0 auto 16px;
        display: block;
        border: 2px solid rgba(20, 184, 166, 0.5);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
      }
      p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.7;
        color: #cbd5e1;
      }
      button {
        width: 100%;
        padding: 13px 18px;
        border: 0;
        border-radius: 14px;
        background: #0d9488;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .en {
        margin-top: 12px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="logo.png" alt="Mehani" class="logo" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذر الاتصال بمنصة <strong>مهني (Mehani)</strong>. يرجى التحقق من اتصال الواي فاي أو بيانات الهاتف ثم إعادة المحاولة.
      </p>
      <button onclick="window.location.href='https://mehani.gt.tc'">
        إعادة المحاولة / Retry
      </button>
      <div class="en">
        Unable to reach mehani.gt.tc. Please check your internet connection.
      </div>
    </div>
  </body>
</html>
