<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mehani | مهني</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
      .top-offline-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: #b91c1c;
        color: #ffffff;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .banner-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .banner-title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        color: #ffffff;
      }
      .banner-sub {
        font-size: 11px;
        line-height: 1.4;
        color: #fee2e2;
        direction: rtl;
        text-align: left;
      }
      .retry-btn {
        flex-shrink: 0;
        padding: 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .retry-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <header class="top-offline-banner" role="alert">
      <div class="banner-text">
        <span class="banner-title">We can't reach our network right now. Please check your connection</span>
        <span class="banner-sub">تعذر الوصول إلى الشبكة حالياً. يرجى التحقق من اتصال الإنترنت</span>
      </div>
      <button type="button" class="retry-btn" onclick="window.location.href='https://mehani.gt.tc'">
        Retry
      </button>
    </header>
  </body>
</html>
