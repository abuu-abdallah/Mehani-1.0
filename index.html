<!doctype html>
<html lang="ar" dir="rtl" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mahara_theme');
          var root = document.documentElement;
          if (saved === 'dark') {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#020617');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مهني | Mehani" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Mehani Sudan - Trade & Service Marketplace | مهني</title>
    <meta name="description" content="منصة مهني - ربط العملاء بالحرفيين وأصحاب المهن الحرة في السودان مثل الخياطة، السباكة، الكهرباء، الحناء والتجميل، والمزيد." />
    <meta property="og:title" content="Mehani Sudan - Trade & Service Marketplace | مهني" />
    <meta property="og:description" content="منصة مهني - ربط العملاء بالحرفيين وأصحاب المهن الحرة في السودان مثل الخياطة، السباكة، الكهرباء، الحناء والتجميل، والمزيد." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-700 selection:text-white transition-colors">

</html>
